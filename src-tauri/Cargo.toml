[package]
name = "talyxel-voice"
version = "0.3.1"
description = "Private, local-first voice dictation"
authors = ["Talyxel"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "talyxel_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
cpal = "0.18.2"
whisper-rs = "0.16.0"
hound = "3.5.1"
arboard = "3.7.0"
anyhow = "1.0.104"
log = "0.4.35"
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["time"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_JobObjects"] }
reqwest = { version = "0.13", default-features = false, features = ["multipart", "json", "rustls", "stream"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-autostart = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# whisper.cpp is unusably slow unoptimized; keep it fast in `tauri dev` too.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[dev-dependencies]
whisper-rs-sys = "0.15"
