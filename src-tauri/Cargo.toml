[package]
name = "talyxel-voice"
version = "0.6.0"
description = "Private, local-first voice dictation"
authors = ["Talyxel"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "talyxel_voice_lib"
# rlib only: staticlib and cdylib are for Android/iOS, which this app doesn't
# target, and in release each one costs its own full LTO link.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16.0"
# The same crate whisper-rs builds; gpu.rs asks its ggml for the devices.
whisper-rs-sys = "0.15"
hound = "3.5.1"
anyhow = "1.0.104"
log = "0.4.35"
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["time"] }
reqwest = { version = "0.13", default-features = false, features = ["multipart", "json", "rustls", "stream"] }
tauri-plugin-log = "2.10.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Desktop only: hotkeys, the tray, pasting into other apps, updates, the Files tab.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
tauri-plugin-global-shortcut = "2.4.1"
cpal = "0.18.2"
arboard = "3.7.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-autostart = "2"
# Folder picker for the Files tab, called from Rust only.
tauri-plugin-dialog = "2"
# Files tab: Ogg demuxing, and libopus (built from source with cmake, like whisper).
ogg = "0.9"
opus = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_LibraryLoader"] }

# Android: the page records the microphone (getUserMedia), whisper runs on the
# CPU, and HTTPS is checked against Mozilla's roots (see net.rs).
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
