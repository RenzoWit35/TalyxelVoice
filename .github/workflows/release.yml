# Builds, signs and publishes a release (installer + latest.json for the
# in-app updater) whenever a v* tag is pushed. Create one with
# `npm run release -- 0.2.0`, then `git push --follow-tags`.
# Pull requests (and manual runs off a branch) build the same installer
# without publishing; it's attached to the run as an artifact to try out.
# Pushes to main build too, only to save the Rust cache: GitHub scopes caches
# to the ref that made them, and a tag or PR can read main's but not another
# tag's, so without these every release compiled all its crates from scratch.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # .cargo/config.toml points these at a local VS install; [env] doesn't
      # override variables that are already set, so these win on CI.
      CMAKE: cmake
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # whisper.cpp's Vulkan shader generator builds in folders nested so deep
      # that under the checkout's target/ its paths pass MSVC's 260 limit.
      CARGO_TARGET_DIR: D:\t
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # The target is relative to src-tauri: D:\t, as CARGO_TARGET_DIR.
          workspaces: src-tauri -> ../../../../t
          # Only main's cache is readable by later tags and PRs; saving one
          # anywhere else spends ~30 s and 600 MB of the 10 GB cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # whisper.cpp must build with the Ninja generator (see .cargo/config.toml).
      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # whisper.cpp's Vulkan backend compiles its shaders with the SDK's glslc
      # and links its vulkan-1.lib (found through VULKAN_SDK).
      - uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: 1.4.363.0
          cache: true

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # An empty tag name builds without publishing.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: TalyxelVoice v__VERSION__
          releaseBody: Installs automatically from the app; see the commits for what changed.
          releaseDraft: false
          prerelease: false

      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: TalyxelVoice-installer
          path: ${{ env.CARGO_TARGET_DIR }}\release\bundle\nsis\*.exe
